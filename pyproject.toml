[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercari-auto"
version = "0.1.0"
description = "Periodically lower prices of Mercari listings via Playwright."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.42",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mercari-auto = "mercari_auto.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
